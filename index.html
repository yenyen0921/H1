<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣即時氣象 (CWA O-A0003-001)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Top Left Dashboard / Stats Panel -->
    <div class="panel top-left-panel">
        <div class="title-bar">
            <h1>台灣即時氣象</h1>
            <span class="badge">資料庫</span>
        </div>
        
        <div class="meta-info">
            <p>觀測時間：<span id="obs-time">載入中...</span></p>
            <p>資料來源：CWA O-A0003-001 / F-D0047-091</p>
            <p>本次讀取：資料庫快取 (未呼叫 API)</p>
            <p>測站數量：<span id="loc-count">22</span> 縣市</p>
        </div>

        <!-- 2x2 Stat Grid -->
        <div class="stat-grid">
            <div class="stat-card">
                <span class="stat-title">最高溫</span>
                <span class="stat-value"><span id="max-temp">-</span> <small>°C</small></span>
                <span class="stat-sub" id="max-temp-loc">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">最低溫</span>
                <span class="stat-value"><span id="min-temp">-</span> <small>°C</small></span>
                <span class="stat-sub" id="min-temp-loc">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">最高降雨機率</span>
                <span class="stat-value"><span id="max-rain">-</span> <small>%</small></span>
                <span class="stat-sub" id="max-rain-loc">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">天氣現象</span>
                <span class="stat-value-text" id="common-weather">-</span>
                <span class="stat-sub">多數地區</span>
            </div>
        </div>
    </div>

    <!-- Right Control Sidebar -->
    <div class="panel right-panel">
        <div class="layer-group">
            <div class="layer-title">圖層</div>
            <button class="layer-btn active" id="btn-temp">🌡️ 氣溫</button>
            <button class="layer-btn" id="btn-rain">🌧️ 降雨機率</button>
            <button class="layer-btn" id="btn-satellite">🛰️ 衛星雲圖</button>
            <button class="layer-btn" id="btn-radar">📡 雷達迴波</button>
        </div>
        
        <div class="layer-group" id="sat-control-group" style="display: none;">
            <div class="layer-title">雲圖透明度</div>
            <input type="range" id="sat-opacity" min="10" max="100" value="70" style="width: 100%; accent-color: #0284c7;">
        </div>

        <div class="layer-group">
            <label class="checkbox-container">
                <input type="checkbox" checked id="toggle-marker">
                <span class="checkmark"></span>
                氣溫/機率 數值標籤
            </label>
        </div>

        <div class="layer-group">
            <div class="layer-title">底圖</div>
            <div class="map-switcher">
                <button class="switcher-btn active" id="base-dark">深色</button>
                <button class="switcher-btn" id="base-street">街道圖</button>
                <button class="switcher-btn" id="base-sat">衛星圖</button>
            </div>
        </div>
        
        <button class="btn-primary" id="btn-locate">📌 重新定位全台</button>
        <button class="btn-secondary" id="btn-open-sat-hub" style="margin-top: 8px;">🛰️ 雲圖分析中心</button>
    </div>

    <!-- Satellite Hub Modal / Viewer -->
    <div class="sat-modal" id="sat-modal" style="display: none;">
        <div class="sat-modal-content">
            <div class="sat-modal-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 20px;">🛰️</span>
                    <div>
                        <h2 style="font-size: 16px; margin: 0; font-weight: 700;">CWA 氣象衛星雲圖中心</h2>
                        <span style="font-size: 11px; color: #94a3b8;" id="modal-sat-time">觀測時間：即時連線中...</span>
                    </div>
                </div>
                <button class="close-btn" id="btn-close-modal">✕</button>
            </div>

            <!-- Satellite Channel Tabs -->
            <div class="sat-channel-tabs">
                <button class="sat-tab-btn active" data-channel="TWI_IR1_CR_800">🇹🇼 台灣彩色</button>
                <button class="sat-tab-btn" data-channel="TWI_IR1_MB_800">🌈 色調強化</button>
                <button class="sat-tab-btn" data-channel="TWI_TRGB_1000">🌍 真實色彩</button>
                <button class="sat-tab-btn" data-channel="CV1_1000">📡 雷達整合</button>
                <button class="sat-tab-btn" data-channel="LCC_IR1_CR_1000">🌏 東亞全區</button>
            </div>

            <!-- Image View -->
            <div class="sat-image-wrap">
                <img id="sat-preview-img" src="https://www.cwa.gov.tw/Data/satellite/TWI_IR1_CR_800/TWI_IR1_CR_800.jpg" alt="CWA Satellite Cloud" />
                <div class="sat-loading" id="sat-loading">載入影像中...</div>
            </div>

            <!-- Interpretation Info -->
            <div class="sat-info-box">
                <h4 id="sat-channel-title">🇹🇼 台灣鄰近彩色紅外線雲圖</h4>
                <p id="sat-channel-desc">清晰呈現台灣本島及周邊海域雲層厚度與高空雲系，濃白色表示雲頂高、水氣充足。</p>
            </div>
        </div>
    </div>

    <!-- Bottom Legend -->
    <div class="legend-panel">
        <div class="legend-title" id="legend-title">°C</div>
        <div class="legend-gradient" id="legend-gradient"></div>
        <div class="legend-labels" id="legend-labels">
            <span>5</span>
            <span>10</span>
            <span>15</span>
            <span>20</span>
            <span>24</span>
            <span>28</span>
            <span>32</span>
            <span>36</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
